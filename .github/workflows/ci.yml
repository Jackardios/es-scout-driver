name: CI

on:
  push:
    branches: [main, master, '*.x']
  pull_request:
    branches: [main, master, '*.x']
    types: [opened, synchronize, reopened, ready_for_review]
  # New Laravel, Scout and Elasticsearch client releases can break a green build
  # without a single commit here. Re-run weekly.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  # Keyed by event too: without it a push shares a group with the scheduled run
  # on the same ref and cancel-in-progress kills the canary.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Scout ${{ matrix.scout }} / ES ${{ matrix.elasticsearch }}${{ matrix.dependencies == 'lowest' && ' (lowest)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Elasticsearch 8.12 leg has never run: it reports without failing the workflow.
    # Drop `experimental` from it once it has been seen green.
    continue-on-error: ${{ matrix.experimental == true }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      elasticsearch:
        image: elasticsearch:${{ matrix.elasticsearch }}
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -f http://localhost:9200/_cluster/health"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        scout: ['11']
        elasticsearch: ['8.19.22', '9.5.3']
        dependencies: ['highest']
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
          - elasticsearch: '8.19.22'
            es_client: '8'
          - elasticsearch: '9.5.3'
            es_client: '9'
          # Scout 10 stores where clauses in another format
          - php: '8.3'
            laravel: '12'
            testbench: '10'
            scout: '10'
            elasticsearch: '9.5.3'
            es_client: '9'
            dependencies: 'highest'
          - php: '8.3'
            laravel: '13'
            testbench: '11'
            scout: '10'
            elasticsearch: '9.5.3'
            es_client: '9'
            dependencies: 'highest'
          - php: '8.2'
            laravel: '12'
            testbench: '10'
            scout: '10'
            elasticsearch: '8.19.22'
            es_client: '8'
            dependencies: 'lowest'
          - php: '8.3'
            laravel: '13'
            testbench: '11'
            scout: '10'
            elasticsearch: '8.19.22'
            es_client: '8'
            dependencies: 'lowest'
          # The oldest Elasticsearch a known application runs, with the newest 8.x client,
          # which is that application's combination too. It runs the same integration
          # suite as the other legs. That suite has no knn, sparse_vector, semantic or
          # text_expansion test, so the version notes on those queries stay unverified.
          - php: '8.3'
            laravel: '12'
            testbench: '10'
            scout: '11'
            elasticsearch: '8.12.2'
            es_client: '8'
            dependencies: 'highest'
            experimental: true
        exclude:
          # Laravel 13 requires PHP 8.3+
          - php: '8.2'
            laravel: '13'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ matrix.dependencies }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ matrix.dependencies }}-composer-

      # Lowest legs pin guzzlehttp/psr7 to 2.x: Guzzle 7 still allows psr7 1.x,
      # which has no PSR-17 factories, and the Elasticsearch client then fails to
      # build. Laravel applications never resolve that combination.
      - name: Install dependencies
        run: |
          composer update \
            --with="orchestra/testbench:^${{ matrix.testbench }}.0" \
            --with="laravel/scout:^${{ matrix.scout }}.0" \
            --with="elasticsearch/elasticsearch:^${{ matrix.es_client }}.0" \
            ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable --with=guzzlehttp/psr7:^2.0' || '' }} \
            --prefer-dist --no-interaction --no-progress

      # A lowest leg that silently resolves above the declared floor stops
      # testing the floor at all.
      - name: Confirm the declared Scout floor was installed
        if: matrix.dependencies == 'lowest'
        run: |
          installed=$(composer show laravel/scout --format=json | php -r 'echo json_decode(stream_get_contents(STDIN), true)["versions"][0];')
          echo "laravel/scout ${installed}"
          test "${installed}" = "v10.24.0"

      - name: Run tests
        run: vendor/bin/phpunit --colors=always
        env:
          ELASTIC_HOST: localhost:9200
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root

  static-analysis:
    name: Static Analysis (PHPStan, PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            testbench: '10'
            laravel: '12'
          - php: '8.5'
            testbench: '11'
            laravel: '13'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-phpstan-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-phpstan-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer update --with="orchestra/testbench:^${{ matrix.testbench }}.0" --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M

  code-style:
    name: Code Style (PHP-CS-Fixer)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-style-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-style-composer-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-audit-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-audit-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies
        run: composer audit
